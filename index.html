<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Leagueofball 공식 홈페이지. 다양한 직업과 능력으로 펼치는 1대1 배틀 게임을 만나보세요.">
  <title>Leagueofball — 공식 홈페이지</title>
  <style>
    :root{--blue:#2868e8;--blue-dark:#1d50bd;--text:#172033;--muted:#667085;--line:#e8edf4}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#fff;color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(900px,calc(100% - 40px));margin:auto}
    header{height:72px;border-bottom:1px solid var(--line);background:#ffffffee}
    .nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:20px;font-weight:900;letter-spacing:-.8px}
    .brand span{color:var(--blue)}
    .links{display:flex;gap:26px;color:#596579;font-size:14px}
    .links a:hover{color:var(--blue)}
    .hero{min-height:570px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 0 82px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
    h1{font-size:clamp(42px,8vw,72px);line-height:1.08;letter-spacing:-3px;margin:24px 0 18px;font-weight:900}
    .lead{max-width:570px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.85}
    .play{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:34px;padding:17px 54px;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:800;box-shadow:0 9px 22px #2868e82b;transition:.18s}
    .play:hover{background:var(--blue-dark);transform:translateY(-2px);box-shadow:0 12px 26px #2868e83b}
    .hint{margin-top:14px;color:#98a2b3;font-size:12px}
    section{padding:66px 0;border-top:1px solid var(--line)}
    .section-title{text-align:center;margin:0 0 12px;font-size:29px;letter-spacing:-1px}
    .section-desc{text-align:center;color:var(--muted);font-size:15px;line-height:1.8;margin:0 auto;max-width:620px}
    .updates{max-width:700px;margin:30px auto 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .update-row{display:flex;align-items:center;gap:16px;padding:20px 22px}
    .update-tag{flex:none;padding:6px 9px;border-radius:7px;background:#eef4ff;color:var(--blue);font-size:11px;font-weight:800}
    .update-copy strong{display:block;font-size:14px;margin-bottom:5px}
    .update-copy span{font-size:13px;color:var(--muted);line-height:1.6}
    footer{border-top:1px solid var(--line);padding:25px 0;color:#98a2b3;font-size:12px;text-align:center}
    @media(max-width:600px){header{height:auto;min-height:66px}.nav{padding:16px 0;align-items:flex-start;flex-direction:column;gap:13px}.links{gap:19px;font-size:13px;flex-wrap:wrap}.hero{min-height:510px;padding:72px 0}.lead{font-size:15px}.play{width:min(100%,310px);padding:16px 20px}.section-title{font-size:25px}.update-row{align-items:flex-start;padding:17px}}
  </style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="#home">LEAGUE<span>OF</span>BALL</a>
    <nav class="links" aria-label="주 메뉴">
      <a href="#updates">업데이트 소식</a>
    </nav>
  </div>
</header>
<main id="home">
  <div class="wrap hero">
    <div class="eyebrow"><span class="dot"></span> OFFICIAL GAME WEBSITE</div>
    <h1>LEAGUE OF BALL</h1>
    <p class="lead">다양한 직업과 특별한 능력으로 펼치는 1대1 배틀 게임!<br>나만의 전략으로 승리를 쟁취하세요.</p>
    <a class="play" href="bol-fight.html"><span aria-hidden="true">▶</span> 게임 플레이</a>
    <div class="hint">버튼을 눌러 바로 게임을 시작하세요.</div>
  </div>

  <section id="updates">
    <div class="wrap">
      <h2 class="section-title">업데이트 소식</h2>
      <p class="section-desc">Leagueofball의 새로운 소식과 변경 사항을 이곳에서 확인할 수 있습니다.</p>
      <div class="updates">
        <div class="update-row">
          <span class="update-tag">NOTICE</span>
          <div class="update-copy">
            <strong>새로운 소식을 준비하고 있어요!</strong>
            <span>업데이트 내용이 등록되면 이곳에 안내할게요.</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">© 2026 LEAGUEOFBALL. All rights reserved.</div>
</footer>
</body>
</html>
