<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>볼 파이트</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2430;--sub:#5d6675;--arena:#fbfaf7;--line:#d8d4ca;--btn:#1d2430;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--ink:#eceef2;--sub:#98a2b3;--arena:#10131a;--line:#2c3340;--btn:#eceef2;--btnt:#14171d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
h1{margin:4px 0 0;font-size:28px;font-family:"Noto Sans KR",sans-serif;font-weight:700;}
p{margin:0;color:var(--sub);font-size:15px;text-align:center}
#row{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:100%}
#wrap{width:100%;max-width:600px;position:relative}
.hb{width:200px;flex:none;height:34px;background:var(--line);border-radius:17px;position:relative;overflow:hidden}
@media (max-width:1060px){#row{flex-wrap:wrap}#wrap{order:-1;flex:0 0 100%}.col{flex:1 1 40%}.hb{width:auto}}
.hb i{position:absolute;top:0;bottom:0;left:0;width:100%;background:#8fd14f}
.hb.r i{left:auto;right:0}
.hb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:20px;color:#fff;text-shadow:-1px 0 #1d2430,1px 0 #1d2430,0 -1px #1d2430,0 1px #1d2430,1px 1px #1d2430,-1px -1px #1d2430,1px -1px #1d2430,-1px 1px #1d2430}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:18px;padding:0}
canvas{width:100%;display:block;background:var(--arena);border:2px solid var(--line);border-radius:18px}
button{font:inherit;font-size:18px;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:10px 26px;cursor:pointer}
button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
#lobby,#pick,#game{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#pick,#game{display:none}
.modes{display:flex;gap:16px;width:100%;justify-content:center}
.mode{display:flex;flex:1 1 0;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:min(62vh,560px);padding:26px 18px;border-radius:24px;border:2px solid var(--line);background:var(--arena);color:var(--ink);font-size:18px;text-align:center}
.mode b{font-size:clamp(26px,4vw,44px);font-weight:700}
.mode span{color:var(--sub);font-size:clamp(15px,1.6vw,20px);max-width:320px}
@media (max-width:760px){.modes{flex-direction:column}.mode{min-height:150px;flex:none;width:100%}}
.mode:hover{border-color:var(--ink)}
.modeBox{display:flex;flex-direction:column;gap:10px;align-items:center}
.count{display:flex;align-items:center;gap:10px;font-size:18px}
.count button{padding:2px 16px;font-size:24px;line-height:1.2}
.count b{min-width:26px;text-align:center;font-size:24px}
.col{display:flex;flex-direction:column;gap:10px}
.many .hb b{font-size:15px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px}
.team>div{display:flex;gap:10px}
#slots{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;font-size:24px}
.slot{width:140px;height:130px;border:2px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px}
.slot.on{border-style:solid}
.slot .q{font-size:40px;color:var(--sub)}
#pm{font-size:18px;color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;width:100%;max-width:900px}
@media (max-width:520px){#grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--arena);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px}
.card:disabled{opacity:.35;cursor:not-allowed}
.b{width:64px;height:64px;border-radius:50%;border:3px solid #1d2430;display:flex;align-items:center;justify-content:center;font-size:30px}
.btns{display:flex;gap:10px}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<h1>볼 파이트</h1>
<div id="lobby">
<p>모드를 골라 주세요</p>
<div class="modes">
<button class="mode" data-m="1v1"><b>⚔️ 1대1 대전</b><span>2명이 1대1로 싸워요</span></button>
<button class="mode" data-m="team"><b>🤝 팀대전</b><span>2 대 2 팀 싸움. 한 팀이 모두 쓰러지면 끝나요</span></button>
<button class="mode" data-m="ffa"><b>🔥 배틀로얄</b><span>여럿이 서로 모두 적! 마지막 한 명이 살아남아요. 인원은 캐릭터 선택에서 정해요 (4~8명)</span></button>
</div>
</div>
<div id="pick">
<div id="slots"></div>
<p id="pm"></p>
<div id="grid"></div>
<div class="count" id="royaleCount" style="display:none"><span>최대 인원</span><button id="ffaMinus" class="ghost">−</button><b id="ffaN">4</b><button id="ffaPlus" class="ghost">+</button><span>명 (4~8)</span></div>
<div class="btns"><button id="toLobby" class="ghost">← 로비</button><button id="reset" class="ghost">다시 고르기</button><button id="startBtn">대결 시작</button></div>
</div>
<div id="game">
<div id="row"><div class="col" id="colL"></div><div id="wrap"><canvas id="c" width="600" height="600"></canvas></div><div class="col" id="colR"></div></div>
<div class="btns"><button id="rb">다시 하기</button><button id="back" class="ghost">캐릭터 다시 고르기</button><button id="lobbyBtn" class="ghost">로비로</button></div>
</div>

document.fonts&&['100px "Jua"','100px "Black Han Sans"','700 100px "Noto Sans KR"'].forEach(f=>document.fonts.load(f));

function renderPick(){
  const sl=document.getElementById('slots');
  if(gameMode==='1v1')sl.innerHTML=slotHTML(0)+'<span>VS</span>'+slotHTML(1);
  else if(gameMode==='team')sl.innerHTML='<div class="team"><b>1팀</b><div>'+slotHTML(0)+slotHTML(1)+'</div></div><span>VS</span><div class="team"><b>2팀</b><div>'+slotHTML(2)+slotHTML(3)+'</div></div>';
  else sl.innerHTML=Array.from({length:NP},(_,k)=>slotHTML(k)).join('');
  document.getElementById('pm').textContent=turn<NP?(turn+1)+'P 캐릭터를 골라 주세요'+(gameMode==='team'?' ('+(teamOf[turn]+1)+'팀)':''):'준비 완료! 대결 시작을 눌러요';
